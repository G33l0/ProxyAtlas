# Alembic configuration for ProxyAtlas.
# The database URL is injected at runtime from application settings
# (see app/database/migrator.py); the value here is a harmless placeholder.

[alembic]
script_location = app/database/migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///proxyatlas.sqlite

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
