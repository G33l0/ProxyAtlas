[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxyatlas"
version = "1.0.0"
description = "ProxyAtlas — Discover. Validate. Analyze. Manage. A PyQt6 desktop application for proxy discovery, validation, intelligence and monitoring."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "ProxyAtlas Project" }]
keywords = ["proxy", "networking", "validation", "geoip", "pyqt6", "desktop"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "PyQt6>=6.6",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "aiohttp-socks>=0.8",
    "python-socks>=2.4",
    "dnspython>=2.6",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyinstaller>=6.6",
]

[project.scripts]
proxyatlas = "app.cli:main"

[project.gui-scripts]
proxyatlas-gui = "app.main:main"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["app/database/migrations", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyqt6"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
